name: Syntax checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile HAPS files
        run: |
          python -m py_compile models/haps.py
          python -m py_compile exp/exp_long_term_forecasting_haps.py
          python -m py_compile run_haps.py

      - name: Validate shell scripts
        run: |
          bash -n scripts/HAPS/traffic.sh
          bash -n scripts/HAPS/traffic_ablation_h720.sh
